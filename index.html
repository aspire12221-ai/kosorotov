<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Чат-бот на базе GPT для управления городским хозяйством и ЖКХ">
    <meta name="author" content="GitHub-проект">
    <title>Городской чат-бот | Умный помощник ЖКХ</title>
    <!-- Google Fonts и Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #e9f0f5 0%, #d4e2ec 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-app {
            max-width: 1400px;
            width: 100%;
            height: 90vh;
            background: rgba(255,255,255,0.96);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #1e3a5f;
            color: white;
            padding: 1rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid #2c5a7a;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-area i {
            font-size: 2rem;
        }
        .title h1 {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .title p {
            font-size: 0.75rem;
            opacity: 0.85;
        }
        .settings-panel {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.12);
            padding: 6px 14px;
            border-radius: 40px;
        }
        .api-input {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border-radius: 32px;
            padding: 4px 12px;
        }
        .api-input input {
            border: none;
            background: transparent;
            padding: 8px 6px;
            font-size: 0.8rem;
            width: 180px;
            font-family: monospace;
            outline: none;
            color: #1e2f3e;
        }
        .api-input button {
            background: none;
            border: none;
            color: #1e3a5f;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-clear {
            background: rgba(255,255,240,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-clear:hover {
            background: rgba(255,255,240,0.4);
        }
        .model-badge {
            font-size: 0.7rem;
            background: #0f2b3b;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #fefef7;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeInUp 0.2s ease;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #eef2fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .user .avatar {
            background: #1e3a5f;
            color: white;
        }
        .bubble {
            background: white;
            padding: 12px 18px;
            border-radius: 24px;
            line-height: 1.45;
            font-size: 0.95rem;
            color: #1f2e3a;
            border: 1px solid #e9edf2;
        }
        .user .bubble {
            background: #1e3a5f;
            color: white;
            border-bottom-right-radius: 6px;
            border: none;
        }
        .bot .bubble {
            border-bottom-left-radius: 6px;
        }
        .thinking .bubble {
            background: #eef2f5;
            color: #4a627a;
            font-style: italic;
        }
        .error-bubble {
            background: #ffe6e5;
            color: #b13e3e;
            border-left: 4px solid #d9534f;
        }

        .chat-input-area {
            padding: 1rem 1.8rem 1.5rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        .input-wrapper {
            background: white;
            border-radius: 48px;
            border: 1px solid #ccdbe8;
            display: flex;
            align-items: center;
            padding: 6px 12px 6px 20px;
        }
        .input-wrapper input {
            flex: 1;
            border: none;
            padding: 12px 0;
            font-size: 0.95rem;
            outline: none;
            background: transparent;
        }
        .input-wrapper button {
            background: #1e3a5f;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-wrapper button:disabled {
            background: #b0c4de;
            cursor: not-allowed;
        }
        .examples {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .example-chip {
            background: #eef2f9;
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1e3a5f;
            cursor: pointer;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 680px) {
            .message { max-width: 95%; }
            .api-input input { width: 130px; }
            .chat-header { padding: 0.8rem 1rem; }
        }
    </style>
</head>
<body>
<div class="chat-app">
    <div class="chat-header">
        <div class="logo-area">
            <i class="fas fa-city"></i>
            <div class="title">
                <h1>Городской советник</h1>
                <p>Управление городским хозяйством • ЖКХ • Инфраструктура</p>
            </div>
        </div>
        <div class="settings-panel">
            <div class="api-input">
                <input type="password" id="apiKeyInput" placeholder="OpenAI API ключ" autocomplete="off">
                <button id="toggleApiKey" title="Показать/скрыть"><i class="far fa-eye-slash"></i></button>
                <button id="saveApiKeyBtn" title="Сохранить"><i class="fas fa-save"></i></button>
            </div>
            <button id="clearChatBtn" class="btn-clear"><i class="fas fa-trash-alt"></i> Очистить</button>
            <div class="model-badge"><i class="fas fa-microchip"></i> GPT-3.5 Turbo</div>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="avatar"><i class="fas fa-robot"></i></div>
            <div class="bubble">
                <p>🏙️ Здравствуйте! Я — городской AI-помощник по ЖКХ, транспорту, благоустройству.<br>⚙️ Для работы <strong>введите ваш OpenAI API ключ</strong> и нажмите 💾 (ключ хранится локально).</p>
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Спросить о городских проблемах, тарифах, ремонте дорог...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div class="examples">
            <span class="example-chip" data-question="Как сообщить о яме на дороге?"><i class="fas fa-road"></i> Яма на дороге</span>
            <span class="example-chip" data-question="Что делать при аварии на отоплении?"><i class="fas fa-temperature-low"></i> Отопление</span>
            <span class="example-chip" data-question="Как рассчитывается плата за вывоз мусора?"><i class="fas fa-trash-alt"></i> Вывоз ТКО</span>
            <span class="example-chip" data-question="Как озеленить двор?"><i class="fas fa-tree"></i> Озеленение</span>
        </div>
    </div>
</div>

<script>
    // ---- DOM элементы ----
    const messagesContainer = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendBtn');
    const clearChatButton = document.getElementById('clearChatBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const toggleApiKeyBtn = document.getElementById('toggleApiKey');
    const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');

    const API_URL = 'https://api.openai.com/v1/chat/completions';
    const DEFAULT_MODEL = 'gpt-3.5-turbo';

    let conversationHistory = [];
    let isLoading = false;

    // Загрузка ключа из localStorage
    function loadApiKey() {
        const saved = localStorage.getItem('urban_gpt_key');
        if (saved) {
            apiKeyInput.value = '••••••••••••••••••••••';
            apiKeyInput.type = 'password';
        }
    }

    function getActualApiKey() {
        if (apiKeyInput.value && apiKeyInput.value.includes('•••')) {
            return localStorage.getItem('urban_gpt_key') || '';
        }
        return apiKeyInput.value.trim();
    }

    function saveApiKey() {
        let newKey = apiKeyInput.value.trim();
        if (newKey && !newKey.includes('•••')) {
            localStorage.setItem('urban_gpt_key', newKey);
            apiKeyInput.value = '••••••••••••••••••••••';
            apiKeyInput.type = 'password';
            addInfoMessage('✅ API ключ сохранён (только в вашем браузере).');
        } else if (newKey === '') {
            localStorage.removeItem('urban_gpt_key');
            apiKeyInput.value = '';
            addInfoMessage('🔑 Ключ удалён. Введите новый для работы.');
        } else {
            addInfoMessage('⚠️ Введите корректный OpenAI ключ (начинается с sk-...).', true);
        }
    }

    function addInfoMessage(text, isError = false) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', 'bot');
        msgDiv.innerHTML = `<div class="avatar"><i class="fas fa-info-circle"></i></div><div class="bubble ${isError ? 'error-bubble' : ''}"><p>ℹ️ ${text}</p></div>`;
        messagesContainer.appendChild(msgDiv);
        scrollToBottom();
        setTimeout(() => msgDiv.remove(), 4500);
    }

    function addMessageToUI(role, content, isError = false) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', role === 'user' ? 'user' : 'bot');
        const avatarIcon = role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-landmark"></i>';
        messageDiv.innerHTML = `
            <div class="avatar">${avatarIcon}</div>
            <div class="bubble ${isError ? 'error-bubble' : ''}"><p>${escapeHtml(content)}</p></div>
        `;
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
        if (!isError && role !== 'system') {
            conversationHistory.push({ role: role, content: content });
            if (conversationHistory.length > 20) conversationHistory.shift();
        }
    }

    let thinkingDiv = null;
    function showThinking() {
        if (thinkingDiv) thinkingDiv.remove();
        thinkingDiv = document.createElement('div');
        thinkingDiv.classList.add('message', 'bot', 'thinking');
        thinkingDiv.innerHTML = `<div class="avatar"><i class="fas fa-brain"></i></div><div class="bubble"><p><i class="fas fa-circle-notch fa-spin"></i> Анализирую запрос...</p></div>`;
        messagesContainer.appendChild(thinkingDiv);
        scrollToBottom();
    }
    function removeThinking() {
        if (thinkingDiv) thinkingDiv.remove();
        thinkingDiv = null;
    }
    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }

    async function sendToGPT(userMessage) {
        const apiKey = getActualApiKey();
        if (!apiKey || apiKey.length < 20) {
            addInfoMessage('Введите действующий OpenAI API ключ и сохраните его.', true);
            return false;
        }
        const systemPrompt = `Ты — профессиональный консультант по управлению городским хозяйством, ЖКХ, транспорту, экологии и благоустройству. Отвечай полезно, по делу, дружелюбно. Если вопрос не по теме, вежливо направь в русло городского хозяйства.`;
        const messagesForAPI = [
            { role: "system", content: systemPrompt },
            ...conversationHistory.slice(-12),
            { role: "user", content: userMessage }
        ];
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({ model: DEFAULT_MODEL, messages: messagesForAPI, temperature: 0.7, max_tokens: 800 })
            });
            if (!resp.ok) {
                let errMsg = `Ошибка ${resp.status}`;
                if (resp.status === 401) errMsg = 'Неверный API ключ.';
                if (resp.status === 429) errMsg = 'Лимит запросов / недостаточно баланса.';
                throw new Error(errMsg);
            }
            const data = await resp.json();
            const botReply = data.choices[0].message.content;
            addMessageToUI('assistant', botReply);
            return true;
        } catch (err) {
            addMessageToUI('assistant', `❌ Ошибка: ${err.message}`, true);
            return false;
        }
    }

    async function handleSendMessage() {
        if (isLoading) return;
        const text = messageInput.value.trim();
        if (!text) return;
        if (!getActualApiKey()) {
            addInfoMessage('Сначала сохраните API ключ (поле справа вверху).', true);
            return;
        }
        addMessageToUI('user', text);
        messageInput.value = '';
        isLoading = true;
        sendButton.disabled = true;
        showThinking();
        try {
            await sendToGPT(text);
        } finally {
            removeThinking();
            isLoading = false;
            sendButton.disabled = false;
            scrollToBottom();
        }
    }

    function clearChat() {
        conversationHistory = [];
        messagesContainer.innerHTML = '';
        const welcome = document.createElement('div');
        welcome.classList.add('message', 'bot');
        welcome.innerHTML = `<div class="avatar"><i class="fas fa-robot"></i></div><div class="bubble"><p>🏙️ Чат очищен. Задавайте вопросы по городскому хозяйству.</p></div>`;
        messagesContainer.appendChild(welcome);
        scrollToBottom();
    }

    function toggleKeyVisibility() {
        if (apiKeyInput.type === 'password') {
            let real = localStorage.getItem('urban_gpt_key');
            if (real && apiKeyInput.value.includes('•••')) apiKeyInput.value = real;
            apiKeyInput.type = 'text';
            toggleApiKeyBtn.innerHTML = '<i class="far fa-eye"></i>';
        } else {
            apiKeyInput.type = 'password';
            if (apiKeyInput.value && !apiKeyInput.value.includes('sk-')) {
                let saved = localStorage.getItem('urban_gpt_key');
                apiKeyInput.value = saved ? '••••••••••••••••••••••' : '';
            }
            toggleApiKeyBtn.innerHTML = '<i class="far fa-eye-slash"></i>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadApiKey();
        sendButton.addEventListener('click', handleSendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !isLoading) handleSendMessage(); });
        clearChatButton.addEventListener('click', clearChat);
        saveApiKeyBtn.addEventListener('click', saveApiKey);
        toggleApiKeyBtn.addEventListener('click', toggleKeyVisibility);
        document.querySelectorAll('.example-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                messageInput.value = chip.getAttribute('data-question');
                handleSendMessage();
            });
        });
        if (!localStorage.getItem('urban_gpt_key')) {
            setTimeout(() => addInfoMessage('🔑 Для работы с ИИ введите OpenAI API ключ и нажмите 💾.'), 600);
        }
    });
</script>
</body>
</html>
